name: Compilar app para Windows (Tauri)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Este workflow solo compila y publica los instaladores como artefactos de GitHub.
# No intenta crear Releases automáticamente, evitando el error:
# "Resource not accessible by integration".
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Instalar dependencias del frontend
        run: npm install

      - name: Compilar app de Windows (Tauri)
        run: npm run tauri build

      - name: Publicar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: Reproductor-YouTube-Variados-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
